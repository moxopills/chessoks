{% extends 'base.html' %}
{% load static %}

{% block title %}대기실 - ChessOK{% endblock %}

{% block content %}
<div class="waiting-container">
    <!-- Room Header -->
    <div class="room-header">
        <h1 class="room-title" id="room-title">로딩 중...</h1>
        <div class="room-info-bar">
            <span class="room-info-item" id="room-time">⏱ --</span>
            <span class="room-info-item" id="room-spectators">👁 관전 가능</span>
        </div>
    </div>

    <!-- Players Area -->
    <div class="players-area">
        <!-- Host -->
        <div class="player-slot" id="host-slot">
            <div class="player-card">
                <div class="avatar avatar-lg">
                    <span class="avatar-placeholder">?</span>
                </div>
                <div class="player-info">
                    <div class="player-name">호스트</div>
                    <div class="player-rating">--</div>
                </div>
                <div class="player-status">
                    <span class="status-badge">대기</span>
                </div>
            </div>
        </div>

        <!-- VS -->
        <div class="vs-divider">
            <span class="vs-text">VS</span>
        </div>

        <!-- Guest -->
        <div class="player-slot" id="guest-slot">
            <div class="player-card empty">
                <div class="avatar avatar-lg">
                    <span class="avatar-placeholder">?</span>
                </div>
                <div class="player-info">
                    <div class="player-name">상대 대기 중...</div>
                    <div class="player-rating">--</div>
                </div>
                <div class="player-status">
                    <span class="status-badge">--</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="action-area">
        <div class="action-buttons" id="action-buttons">
            <!-- 동적으로 버튼 생성 -->
        </div>
        <button class="btn btn-secondary" id="leave-btn">나가기</button>
    </div>

    <!-- Room Chat -->
    <div class="room-chat-section">
        <div class="section-header">
            <h2 class="section-title">채팅</h2>
        </div>
        <div class="chat-container">
            <div class="chat-messages" id="chat-messages"></div>
            <form class="chat-form" id="chat-form">
                <input type="text" class="chat-input" id="chat-input" placeholder="메시지 입력..." maxlength="500" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                <button type="submit" class="btn btn-primary btn-sm">전송</button>
            </form>
        </div>
    </div>
</div>

<div class="modal-overlay hidden" id="status-modal">
    <div class="modal">
        <div class="modal-header">
            <h2 class="modal-title" id="status-modal-title">알림</h2>
        </div>
        <div class="modal-body">
            <p id="status-modal-message">상대가 준비했습니다.</p>
            <div class="modal-actions">
                <button class="btn btn-primary" id="status-modal-ok">확인</button>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay hidden" id="status-modal">
    <div class="modal">
        <div class="modal-header">
            <h2 class="modal-title" id="status-modal-title">알림</h2>
        </div>
        <div class="modal-body">
            <p id="status-modal-message">상대가 준비했습니다.</p>
            <div class="modal-actions">
                <button class="btn btn-primary" id="status-modal-ok">확인</button>
            </div>
        </div>
    </div>
</div>

<div class="mobile-tabbar" id="mobile-tabbar">
    <button class="mobile-tab active" data-tab="main">대기실</button>
    <button class="mobile-tab" data-tab="chat">
        채팅
        <span class="mobile-tab-badge hidden" id="chat-badge">0</span>
    </button>
</div>
{% endblock %}

<style>

}
