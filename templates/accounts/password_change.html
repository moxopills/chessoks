{% extends 'base.html' %}
{% load static %}

{% block title %}비밀번호 변경 - ChessOK{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <span class="logo-icon">&#9889;</span>
            </div>
            <h1 class="auth-title">비밀번호 변경</h1>
            <p class="auth-subtitle">새 비밀번호로 변경합니다</p>
        </div>

        <form id="password-change-form" class="auth-form" novalidate>
            <div class="form-group">
                <label class="form-label" for="current-password">현재 비밀번호</label>
                <input class="form-input" id="current-password" type="password" autocomplete="current-password" required>
                <div class="form-error" id="current-password-error"></div>
            </div>
            <div class="form-group">
                <label class="form-label" for="new-password">새 비밀번호</label>
                <input class="form-input" id="new-password" type="password" autocomplete="new-password" required>
                <div class="form-hint">8자 이상, 영문 대소문자/숫자/특수문자 각각 1개 이상</div>
                <div class="form-error" id="new-password-error"></div>
            </div>
            <div class="form-group">
                <label class="form-label" for="new-password2">새 비밀번호 확인</label>
                <input class="form-input" id="new-password2" type="password" autocomplete="new-password" required>
                <div class="form-error" id="new-password2-error"></div>
            </div>
            <div class="form-error" id="form-error"></div>
            <button type="submit" class="btn btn-primary btn-arcade btn-block">변경하기</button>
        </form>

        <div class="auth-footer">
            <a href="/profile/" class="auth-link">프로필로 돌아가기</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/pages/password_change.js' %}"></script>
{% endblock %}
