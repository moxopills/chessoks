{% extends 'base.html' %}
{% load static %}

{% block title %}비밀번호 재설정 - ChessOK{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <span class="logo-icon">&#128272;</span>
            </div>
            <h1 class="auth-title">비밀번호 재설정</h1>
            <p class="auth-subtitle">이메일로 인증 링크를 받습니다</p>
        </div>

        <form id="password-reset-request-form" class="auth-form" novalidate>
            <div class="form-group">
                <label class="form-label" for="reset-email">이메일</label>
                <input class="form-input" id="reset-email" type="email" autocomplete="email" required>
                <div class="form-error" id="reset-email-error"></div>
            </div>
            <button type="submit" class="btn btn-primary btn-arcade btn-block">재설정 메일 보내기</button>
        </form>

        <div class="divider"></div>

        <form id="password-reset-confirm-form" class="auth-form" novalidate>
            <div class="form-group">
                <label class="form-label" for="reset-token">인증 토큰</label>
                <input class="form-input" id="reset-token" placeholder="메일로 받은 토큰" required>
                <div class="form-error" id="reset-token-error"></div>
            </div>
            <div class="form-group">
                <label class="form-label" for="reset-password">새 비밀번호</label>
                <input class="form-input" id="reset-password" type="password" autocomplete="new-password" required>
                <div class="form-hint">8자 이상, 영문 대소문자/숫자/특수문자 각각 1개 이상</div>
                <div class="form-error" id="reset-password-error"></div>
            </div>
            <div class="form-group">
                <label class="form-label" for="reset-password2">새 비밀번호 확인</label>
                <input class="form-input" id="reset-password2" type="password" autocomplete="new-password" required>
                <div class="form-error" id="reset-password2-error"></div>
            </div>
            <div class="form-error" id="reset-form-error"></div>
            <button type="submit" class="btn btn-primary btn-arcade btn-block">비밀번호 변경</button>
        </form>

        <div class="auth-footer">
            <a href="/login/" class="auth-link">로그인으로 돌아가기</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/pages/password_reset.js' %}"></script>
{% endblock %}
