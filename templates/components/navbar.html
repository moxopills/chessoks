{% load static %}
<!-- Navigation Bar -->
<nav class="navbar">
    <div class="navbar-container">
        <!-- Logo -->
        <a href="/" class="navbar-logo">
            <span class="logo-icon">&#9822;</span>
            <span class="logo-text">ChessOK</span>
        </a>

        <!-- Navigation Links (Desktop) -->
        <div class="navbar-menu" id="navbar-menu">
            <a href="/" class="navbar-link{% if request.path == '/' or request.path == '/lobby/' %} active{% endif %}">
                <span class="navbar-link-icon">🏠</span>
                <span>로비</span>
            </a>
            <a href="/rooms/" class="navbar-link{% if request.path|slice:':7' == '/rooms/' %} active{% endif %}">
                <span class="navbar-link-icon">🧭</span>
                <span>방 목록</span>
            </a>
            <a href="/leaderboard/" class="navbar-link{% if request.path|slice:':13' == '/leaderboard/' %} active{% endif %}">
                <span class="navbar-link-icon">📊</span>
                <span>랭킹</span>
            </a>
            <a href="/seasons/" class="navbar-link{% if request.path|slice:':9' == '/seasons/' %} active{% endif %}">
                <span class="navbar-link-icon">&#127942;</span>
                <span>시즌</span>
            </a>
            <a href="/friends/" class="navbar-link{% if request.path|slice:':9' == '/friends/' %} active{% endif %}">
                <span class="navbar-link-icon">🤝</span>
                <span>친구</span>
            </a>
            <a href="/guilds/" class="navbar-link{% if request.path|slice:':8' == '/guilds/' %} active{% endif %}">
                <span class="navbar-link-icon">🛡️</span>
                <span>길드</span>
            </a>
            <a href="/parties/" class="navbar-link{% if request.path|slice:':9' == '/parties/' %} active{% endif %}">
                <span class="navbar-link-icon">👥</span>
                <span>파티</span>
            </a>
            <a href="/board/" class="navbar-link{% if request.path|slice:':7' == '/board/' %} active{% endif %}">
                <span class="navbar-link-icon">📝</span>
                <span>게시판</span>
            </a>
            <a href="/tournaments/" class="navbar-link{% if request.path|slice:':13' == '/tournaments/' %} active{% endif %}">
                <span class="navbar-link-icon">🏆</span>
                <span>컵전</span>
            </a>
            {% if request.user.is_authenticated %}
            <a href="/customize/" class="navbar-link{% if request.path|slice:':11' == '/customize/' %} active{% endif %}">
                <span class="navbar-link-icon">🎨</span>
                <span>커스터마이징</span>
            </a>
            {% endif %}
            {% if request.user.is_authenticated and request.user.is_staff %}
            <a href="/admin-panel/" class="navbar-link{% if request.path|slice:':13' == '/admin-panel/' %} active{% endif %}">
                <span class="navbar-link-icon">🛠️</span>
                <span>관리</span>
            </a>
            {% endif %}
        </div>

        <!-- Right Section -->
        <div class="navbar-right">
            <!-- Notification Bell (Authenticated) -->
            <div class="navbar-notifications auth-only{% if not request.user.is_authenticated or request.user.is_guest %} hidden{% endif %}" id="notification-bell">
                <button class="notification-btn" id="notification-toggle" aria-label="알림" aria-haspopup="true" aria-expanded="false" aria-controls="notification-dropdown">
                    <span class="notification-icon">&#128276;</span>
                    <span class="notification-badge hidden" id="notification-count" aria-live="polite" aria-atomic="true">0</span>
                </button>
                <div class="notification-dropdown hidden" id="notification-dropdown">
                    <div class="notification-header">
                        <span>알림</span>
                        <button class="notification-mark-read" id="mark-all-read">모두 읽음</button>
                    </div>
                    <div class="notification-list" id="notification-list">
                        <div class="notification-empty">새 알림이 없습니다</div>
                    </div>
                </div>
            </div>

            <!-- User Menu (Authenticated) -->
            <div class="navbar-user auth-only{% if not request.user.is_authenticated or request.user.is_guest %} hidden{% endif %}" id="user-menu">
                <button class="user-btn" id="user-toggle" aria-haspopup="true" aria-expanded="false" aria-controls="user-dropdown">
                    <div class="avatar avatar-sm" id="user-avatar">
                        <span class="avatar-placeholder">?</span>
                    </div>
                    <span class="user-nickname" id="user-nickname">로딩 중...</span>
                    <span class="user-rating" id="user-rating"></span>
                </button>
                <div class="user-dropdown hidden" id="user-dropdown">
                    <a href="/profile/" class="dropdown-item">
                        <span>&#9881;</span> 프로필
                    </a>
                    <a href="/history/" class="dropdown-item">
                        <span>&#128203;</span> 전적
                    </a>
                    <a href="/customize/" class="dropdown-item">
                        <span>&#127912;</span> 커스터마이징
                    </a>
                    <hr class="dropdown-divider">
                    <button class="dropdown-item dropdown-logout" id="logout-btn">
                        <span>&#10140;</span> 로그아웃
                    </button>
                </div>
            </div>

            <!-- Install App Button (PWA) -->
            <button class="btn btn-primary btn-sm" id="install-app-btn" style="display: none; padding: 4px 8px; font-size: 0.75rem; white-space: nowrap; margin-right: 4px;">
                앱 다운로드
            </button>

            <!-- Sound Dropdown -->
            <div class="navbar-sound" style="position: relative; display: flex; align-items: center;">
                <button class="theme-toggle" id="sound-toggle" aria-label="볼륨 조절" style="margin-right: 8px;">
                    <span class="theme-icon" id="sound-icon">🔊</span>
                </button>
                <div class="sound-dropdown hidden" id="sound-dropdown" style="position: absolute; top: 100%; right: 0; margin-top: 12px; background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 16px; box-shadow: var(--shadow-lg); z-index: 1000; width: 160px; display: flex; flex-direction: column; gap: 8px;">
                    <div style="font-size: 0.75rem; font-weight: 600; color: var(--color-text-primary); display: flex; justify-content: space-between;">
                        <span>배경음악</span>
                        <span id="sound-vol-text">30%</span>
                    </div>
                    <input type="range" id="sound-slider" min="0" max="100" step="10" value="30" style="width: 100%; cursor: pointer;">
                    <button class="btn btn-secondary btn-xs" id="sound-mute-toggle" type="button">음소거</button>
                </div>
            </div>

            <!-- Theme Toggle -->
            <button class="theme-toggle" id="theme-toggle" aria-label="테마 변경">
                <span class="theme-icon" id="theme-icon">🌙</span>
            </button>

            <!-- Auth Buttons (Guest) -->
            <div class="navbar-auth guest-only{% if request.user.is_authenticated and not request.user.is_guest %} hidden{% endif %}" id="auth-buttons">
                <a href="/login/" class="btn btn-secondary btn-sm">로그인</a>
                <a href="/signup/" class="btn btn-primary btn-sm">회원가입</a>
            </div>

            <!-- Mobile Menu Toggle -->
            <button class="navbar-toggle" id="navbar-toggle" aria-label="메뉴">
                <span class="toggle-bar"></span>
                <span class="toggle-bar"></span>
                <span class="toggle-bar"></span>
            </button>
        </div>
    </div>
</nav>

<style>
/* Navbar Styles */
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: calc(var(--navbar-height) + env(safe-area-inset-top, 0px));
    padding-top: env(safe-area-inset-top, 0px);
    background-color: var(--color-bg-secondary);
    border-bottom: 2px solid var(--color-border);
    z-index: 100;
    font-family: var(--font-body);
}

.navbar-container {
    max-width: var(--content-max-width);
    height: 100%;
    margin: 0 auto;
    padding: 0 var(--space-lg);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

/* Logo */
.navbar-logo {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    text-decoration: none;
    color: var(--color-text-primary);
}

.logo-icon {
    font-size: 1.5rem;
    color: var(--color-accent-primary);
}

.logo-text {
    font-family: var(--font-display);
    font-size: 1rem;
    font-weight: bold;
    letter-spacing: -0.02em;
}

/* Navigation Menu */
.navbar-menu {
    display: flex;
    align-items: center;
    gap: var(--space-xs);
}

.navbar-link {
    display: flex;
    align-items: center;
    gap: var(--space-xs);
    padding: var(--space-sm) var(--space-md);
    color: var(--color-text-secondary);
    text-decoration: none;
    font-family: var(--font-body);
    font-size: 0.875rem;
    border-radius: var(--radius-md);
    transition: all var(--transition-fast);
}

.navbar-link:hover {
    color: var(--color-text-primary);
    background-color: var(--color-bg-tertiary);
}

.navbar-link.active {
    color: var(--color-accent-primary);
    background: color-mix(in srgb, var(--color-accent-primary) 10%, transparent);
    box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--color-accent-primary) 65%, transparent);
}

.navbar-link-icon {
    font-size: 1rem;
}

/* Right Section */
.navbar-right {
    display: flex;
    align-items: center;
    gap: 8px; /* 기존 var(--space-md)에서 축소 */
}

.theme-toggle {
    border: 1px solid var(--color-border);
    background: var(--color-bg-tertiary);
    color: var(--color-text-primary);
    width: 32px; /* 36px에서 축소 */
    height: 32px; /* 36px에서 축소 */
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all var(--transition-fast);
}

.theme-toggle:hover {
    border-color: var(--color-accent-secondary);
}

.theme-icon {
    font-size: 0.9rem; /* 1rem에서 축소 */
    line-height: 1;
}

.navbar-messages {
    position: relative;
}

.message-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-xs) 4px; /* 패딩 축소 */
    color: var(--color-text-secondary);
    text-decoration: none;
    font-size: 1rem; /* 1.1rem에서 축소 */
    transition: color var(--transition-fast);
}

.message-btn:hover {
    color: var(--color-text-primary);
}

/* Notifications */
.navbar-notifications {
    position: relative;
    flex: 0 0 30px;
    width: 30px;
    min-height: 30px;
}

.notification-btn {
    position: relative;
    padding: var(--space-xs) 4px; /* 패딩 축소 */
    background: none;
    border: none;
    cursor: pointer;
    color: var(--color-text-secondary);
    font-size: 1.1rem; /* 1.25rem에서 축소 */
    transition: color var(--transition-fast);
}

.notification-btn:hover {
    color: var(--color-text-primary);
}

.notification-badge {
    position: absolute;
    top: 0;
    right: 0;
    min-width: 18px;
    height: 18px;
    padding: 0 4px;
    background-color: var(--color-accent-primary);
    color: white;
    font-size: 0.625rem;
    font-weight: 700;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.notification-dropdown {
    position: absolute;
    top: 100%;
    right: 0;
    width: 320px;
    margin-top: var(--space-sm);
    background-color: var(--color-bg-card);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
}

.notification-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-md);
    border-bottom: 1px solid var(--color-border);
    font-weight: 500;
}

.notification-mark-read {
    background: none;
    border: none;
    color: var(--color-accent-secondary);
    font-size: 0.75rem;
    cursor: pointer;
}

.notification-list {
    max-height: 300px;
    overflow-y: auto;
}

.notification-empty {
    padding: var(--space-xl);
    text-align: center;
    color: var(--color-text-muted);
    font-size: 0.875rem;
}

.notification-item {
    padding: var(--space-md);
    border-bottom: 1px solid var(--color-border);
    cursor: pointer;
    transition: background-color var(--transition-fast);
}

.notification-item:hover {
    background-color: var(--color-bg-tertiary);
}

.notification-item.unread {
    background-color: rgba(15, 155, 142, 0.1);
}

.notification-item-title {
    font-size: 0.75rem;
    font-weight: 600;
    margin-bottom: var(--space-xs);
}

.notification-item-message {
    font-size: 0.75rem;
    color: var(--color-text-secondary);
    margin-bottom: var(--space-xs);
}

.notification-item-time {
    font-size: 0.625rem;
    color: var(--color-text-muted);
}

/* User Menu */
.navbar-user {
    position: relative;
    min-width: 176px;
}

.user-btn {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: var(--space-sm);
    padding: var(--space-xs) var(--space-sm);
    background: none;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    cursor: pointer;
    color: var(--color-text-primary);
    transition: border-color var(--transition-fast);
    min-width: 176px;
    min-height: 40px;
}

.user-btn:hover {
    border-color: var(--color-border-light);
}

.navbar .user-nickname {
    font-size: 0.75rem;
    font-weight: 500;
    max-width: 120px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.navbar .user-rating {
    font-size: 0.75rem;
    color: var(--color-accent-secondary);
    min-width: 3ch;
    text-align: right;
}

.user-dropdown {
    position: absolute;
    top: 100%;
    right: 0;
    width: 180px;
    margin-top: var(--space-sm);
    background-color: var(--color-bg-card);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
}

.dropdown-item {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    width: 100%;
    padding: var(--space-md);
    background: none;
    border: none;
    color: var(--color-text-primary);
    font-size: 0.875rem;
    text-decoration: none;
    cursor: pointer;
    transition: background-color var(--transition-fast);
}

.dropdown-item:hover {
    background-color: var(--color-bg-tertiary);
}

.dropdown-logout {
    color: var(--color-accent-error);
}

.dropdown-divider {
    border: none;
    border-top: 1px solid var(--color-border);
    margin: 0;
}

/* Auth Buttons */
.navbar-auth {
    display: flex;
    gap: var(--space-sm);
    min-height: 40px;
}

/* Mobile Toggle */
.navbar-toggle {
    display: none;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    width: 32px;
    height: 32px;
    padding: 4px;
    background: none;
    border: none;
    cursor: pointer;
}

.toggle-bar {
    width: 100%;
    height: 2px;
    background-color: var(--color-text-primary);
    transition: all var(--transition-fast);
}

/* Responsive */
@media (max-width: 768px) {
    .navbar-container {
        padding: 0 var(--space-sm);
        gap: 8px;
    }

    .navbar-menu {
        display: none;
        position: absolute;
        top: var(--navbar-height);
        left: 0;
        right: 0;
        flex-direction: column;
        background-color: var(--color-bg-secondary);
        border-bottom: 2px solid var(--color-border);
        padding: var(--space-md);
    }

    .navbar-menu.active {
        display: flex;
    }

    .navbar-link {
        width: 100%;
        padding: var(--space-md);
    }

    .navbar-toggle {
        display: flex;
        flex: 0 0 32px;
    }

    .navbar-auth .btn span {
        display: none;
    }

    .navbar-right {
        gap: 6px;
        min-width: 0;
        flex-shrink: 0;
    }

    .navbar-user {
        min-width: auto;
    }

    .user-btn {
        min-width: 40px;
        width: 40px;
        padding: 3px;
        justify-content: center;
        border-radius: 999px;
    }

    .navbar-notifications {
        flex: 0 0 28px;
        width: 28px;
        min-height: 28px;
    }

    .notification-btn {
        padding: 0;
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    #install-app-btn {
        display: none !important;
    }

    .navbar .user-nickname,
    .navbar .user-rating {
        display: none;
    }

    .notification-dropdown {
        position: fixed;
        top: calc(var(--navbar-height) + var(--space-sm));
        left: var(--space-md);
        right: var(--space-md);
        width: auto;
        max-height: calc(100vh - var(--navbar-height) - 140px);
        overflow-y: auto;
    }

    .notification-list {
        max-height: none;
    }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // DOM Elements
    const navbarToggle = document.getElementById('navbar-toggle');
    const navbarMenu = document.getElementById('navbar-menu');
    const userToggle = document.getElementById('user-toggle');
    const userDropdown = document.getElementById('user-dropdown');
    const notificationToggle = document.getElementById('notification-toggle');
    const notificationDropdown = document.getElementById('notification-dropdown');
    const logoutBtn = document.getElementById('logout-btn');
    
    // Sound elements
    const soundToggle = document.getElementById('sound-toggle');
    const soundIcon = document.getElementById('sound-icon');
    const soundDropdown = document.getElementById('sound-dropdown');
    const soundSlider = document.getElementById('sound-slider');
    const soundVolText = document.getElementById('sound-vol-text');
    const soundMuteToggle = document.getElementById('sound-mute-toggle');

    function setExpanded(button, expanded) {
        if (!button) return;
        button.setAttribute('aria-expanded', expanded ? 'true' : 'false');
    }

    function closeAllDropdowns() {
        userDropdown?.classList.add('hidden');
        notificationDropdown?.classList.add('hidden');
        soundDropdown?.classList.add('hidden');
        setExpanded(userToggle, false);
        setExpanded(notificationToggle, false);
    }
    
    function updateSoundUI(vol) {
        if (soundIcon) soundIcon.textContent = vol === 0 ? '🔇' : '🔊';
        if (soundToggle) soundToggle.setAttribute('aria-label', vol === 0 ? '소리 켜기' : '소리 끄기');
        if (soundSlider) soundSlider.value = vol;
        if (soundVolText) soundVolText.textContent = `${vol}%`;
        if (soundMuteToggle) soundMuteToggle.textContent = vol === 0 ? '소리 켜기' : '음소거';
    }
    
    if (soundToggle && typeof Utils !== 'undefined' && Utils?.Sounds) {
        // Initialize UI with saved volume
        updateSoundUI(Utils.Sounds.getVolume());
        // 페이지 진입 즉시 BGM 재생 시도
        Utils.Sounds.playBGM();
        const unlockAudio = () => Utils.Sounds.unlock?.();
        document.addEventListener('pointerdown', unlockAudio, { once: true });
        document.addEventListener('keydown', unlockAudio, { once: true });
        
        soundToggle.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            Utils.Sounds.unlock?.();
            if (soundDropdown) {
                soundDropdown.classList.toggle('hidden');
                setExpanded(userToggle, false);
                setExpanded(notificationToggle, false);
                if (!soundDropdown.classList.contains('hidden')) {
                    Utils.Sounds.playBGM();
                    Utils.Sounds.chat?.(); // 즉시 반응 확인용
                }
                userDropdown?.classList.add('hidden');
                notificationDropdown?.classList.add('hidden');
            }
        });

        // 모바일/특정 브라우저에서 click 누락 대비
        soundToggle.addEventListener('pointerdown', function(e) {
            e.preventDefault();
            Utils.Sounds.unlock?.();
        });

        if (soundSlider) {
            soundSlider.addEventListener('input', function(e) {
                const vol = parseInt(e.target.value, 10);
                if (soundVolText) soundVolText.textContent = `${vol}%`;
                Utils.Sounds.setVolume(vol);
                updateSoundUI(vol);
                Utils.Sounds.chat?.(); // 볼륨 조절 즉시 피드백
            });
            soundSlider.addEventListener('change', function(e) {
                const vol = parseInt(e.target.value, 10);
                Utils.Sounds.setVolume(vol);
                updateSoundUI(vol);
            });
        }
        soundMuteToggle?.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            Utils.Sounds.unlock?.();
            const isMutedNow = Utils.Sounds.toggleMute();
            updateSoundUI(isMutedNow ? 0 : Utils.Sounds.getVolume());
        });
        soundDropdown?.addEventListener('click', function(e) {
            e.stopPropagation();
        });
        
        // 자동재생 차단 브라우저를 위해 첫 클릭 시 재시도
        document.body.addEventListener('click', function playOnce() {
            Utils.Sounds.playBGM();
            document.body.removeEventListener('click', playOnce);
        }, { once: true });
    }

    // Mobile menu toggle
    if (navbarToggle && navbarMenu) {
        navbarToggle.addEventListener('click', function(e) {
            e.stopPropagation();
            navbarMenu.classList.toggle('active');
        });

        // Close mobile menu on outside click
        document.addEventListener('click', function(e) {
            if (navbarMenu.classList.contains('active') &&
                !navbarMenu.contains(e.target) &&
                !navbarToggle.contains(e.target)) {
                navbarMenu.classList.remove('active');
            }
        });

        // Close mobile menu on Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && navbarMenu.classList.contains('active')) {
                navbarMenu.classList.remove('active');
                navbarToggle.focus();
            }
        });
    }

    // User dropdown toggle
    if (userToggle && userDropdown) {
        userToggle.addEventListener('click', function(e) {
            e.stopPropagation();
            const willOpen = userDropdown.classList.contains('hidden');
            userDropdown.classList.toggle('hidden');
            setExpanded(userToggle, willOpen);
            setExpanded(notificationToggle, false);
            notificationDropdown?.classList.add('hidden');
            soundDropdown?.classList.add('hidden');
        });
    }

    // Notification dropdown toggle
    if (notificationToggle && notificationDropdown) {
        notificationToggle.addEventListener('click', function(e) {
            e.stopPropagation();
            const willOpen = notificationDropdown.classList.contains('hidden');
            notificationDropdown.classList.toggle('hidden');
            setExpanded(notificationToggle, willOpen);
            setExpanded(userToggle, false);
            userDropdown?.classList.add('hidden');
            soundDropdown?.classList.add('hidden');
        });
    }

    // Close dropdowns when clicking outside
    document.addEventListener('click', closeAllDropdowns);

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeAllDropdowns();
        }
    });

    // Logout button
    if (logoutBtn) {
        logoutBtn.addEventListener('click', async function() {
            try {
                await API.post('/accounts/logout/');
                window.location.href = '/login/';
            } catch (error) {
                Toast.error('로그아웃에 실패했습니다.');
            }
        });
    }

    // Check auth status and update UI
    updateAuthUI();

    // Live update user info (e.g., avatar change)
    window.addEventListener('user:updated', (event) => {
        const user = event.detail?.user;
        if (user) {
            showAuthenticatedUI(user);
        }
    });
});

async function updateAuthUI() {
    try {
        const user = await API.get('/accounts/me/');
        showAuthenticatedUI(user);
    } catch (error) {
        showGuestUI();
    }
}

function showAuthenticatedUI(user) {
    document.querySelectorAll('.auth-only').forEach(el => el.classList.remove('hidden'));
    document.querySelectorAll('.guest-only').forEach(el => el.classList.add('hidden'));

    const userNickname = document.getElementById('user-nickname');
    const userRating = document.getElementById('user-rating');
    const userAvatar = document.getElementById('user-avatar');

    if (userNickname) userNickname.textContent = user.nickname;
    if (userRating && user.stats) userRating.textContent = user.stats.rating;
    if (userAvatar) {
        if (window.Utils?.setAvatar) {
            Utils.setAvatar(userAvatar, {
                url: user.avatar_url,
                alt: user.nickname || 'avatar',
                placeholder: user.nickname?.[0] || '?',
                placeholderClass: 'avatar-placeholder',
            });
        } else {
            userAvatar.textContent = '';
            if (user.avatar_url) {
                const img = document.createElement('img');
                img.src = user.avatar_url;
                img.alt = user.nickname || 'avatar';
                userAvatar.appendChild(img);
            } else {
                userAvatar.textContent = user.nickname?.[0] || '?';
            }
        }
    }

    if (window.Notifications?.init) {
        window.Notifications.init();
    }
}

function showGuestUI() {
    document.querySelectorAll('.auth-only').forEach(el => el.classList.add('hidden'));
    document.querySelectorAll('.guest-only').forEach(el => el.classList.remove('hidden'));
}

// PWA Install Prompt
let deferredPrompt;

function isIos() {
    const userAgent = window.navigator.userAgent.toLowerCase();
    return /iphone|ipad|ipod/.test(userAgent);
}

function isInStandaloneMode() {
    return ('standalone' in window.navigator) && (window.navigator.standalone);
}

function isNativeApp() {
    // React Native, Capacitor, iOS WKWebView(messageHandlers) 등 앱 래퍼 환경 확인
    // 또는 UserAgent에 'safari'가 포함되지 않은 iOS 웹뷰 확인
    const ua = window.navigator.userAgent.toLowerCase();
    return Boolean(
        window.ReactNativeWebView || 
        window.Capacitor || 
        (window.webkit && window.webkit.messageHandlers) || 
        (/iphone|ipad|ipod/.test(ua) && !/safari/.test(ua))
    );
}

document.addEventListener('DOMContentLoaded', () => {
    // iOS 사용자에게 앱 설치 안내 토스트 띄우기 (네이티브 앱이 아닐 때만)
    if (isIos() && !isInStandaloneMode() && !isNativeApp()) {
        const hasSeenIosPrompt = Utils.Storage.get('has-seen-ios-prompt', false);
        if (!hasSeenIosPrompt) {
            setTimeout(() => {
                Toast.info('💡 앱으로 즐기시려면 하단 공유 버튼(⍐)을 눌러 [홈 화면에 추가]를 선택해주세요!', 8000);
                Utils.Storage.set('has-seen-ios-prompt', true);
            }, 3000); // 페이지 로드 3초 후 안내
        }
    }
});

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    const installBtn = document.getElementById('install-app-btn');
    if (installBtn) {
        installBtn.style.display = 'inline-flex';
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                await deferredPrompt.userChoice;
                deferredPrompt = null;
                installBtn.style.display = 'none';
            }
        }, { once: true });
    }
});
</script>
