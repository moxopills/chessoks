{% extends 'base.html' %}
{% load static %}

{% block title %}1:1 메시지 - ChessOK{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/message_threads.css' %}">
{% endblock %}

{% block content %}
<div class="thread-page">
    <div class="page-header">
        <div>
            <h1 class="page-title">1:1 메시지</h1>
            <p class="page-subtitle">대화 목록을 확인하고 이어서 대화할 수 있습니다.</p>
        </div>
    </div>

    <div class="thread-list" id="thread-list">
        <div class="thread-card">
            <div class="thread-info">
                <div class="thread-avatar"><div class="skeleton skeleton-avatar sk-w-40 sk-h-40"></div></div>
                <div class="thread-text">
                    <div class="skeleton sk-w-120 sk-h-12 sk-mb-8"></div>
                    <div class="skeleton sk-w-180 sk-h-11"></div>
                </div>
            </div>
            <div class="thread-action">
                <div class="skeleton sk-w-70 sk-h-10 sk-mb-8"></div>
                <div class="skeleton sk-w-62 sk-h-26 sk-round-8"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/pages/message_threads.js' %}"></script>
{% endblock %}
