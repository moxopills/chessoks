{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="실시간 체스 멀티플레이 게임">
    <title>{% block title %}ChessOK{% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{% static 'images/icons/favicon.svg' %}">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    {% include 'components/navbar.html' %}

    <!-- Flash Messages -->
    <div id="toast-container"></div>

    <!-- Global Notice Modal -->
    <div class="notice-modal-overlay hidden" id="global-notice-modal">
        <div class="notice-modal">
            <h3 class="notice-modal-title" id="global-notice-title">📣 공지</h3>
            <p class="notice-modal-message" id="global-notice-message"></p>
            <button class="btn btn-primary btn-sm" id="global-notice-close">확인</button>
        </div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <span class="footer-brand">ChessOK &copy; 2025</span>
            <span class="footer-dev">개발자: Minsoo</span>
            <span class="footer-contact">문의사항: moxopills@gmail.com</span>
        </div>
    </footer>

    <!-- CSRF Token -->
    <script>
        window.CSRF_TOKEN = '{{ csrf_token }}';
    </script>

    <!-- Core Scripts -->
    <script src="{% static 'js/core/api.js' %}"></script>
    <script src="{% static 'js/core/utils.js' %}"></script>
    <script src="{% static 'js/components/toast.js' %}"></script>
    <script src="{% static 'js/components/notifications.js' %}"></script>
    <script>
        (function() {
            const root = document.documentElement;
            const toggle = document.getElementById('theme-toggle');
            const icon = document.getElementById('theme-icon');
            const STORAGE_KEY = 'chessok-theme';

            function applyTheme(theme) {
                if (theme === 'light') {
                    root.setAttribute('data-theme', 'light');
                    if (icon) icon.textContent = '🌙';
                    if (toggle) toggle.setAttribute('aria-label', '다크 모드');
                } else {
                    root.removeAttribute('data-theme');
                    if (icon) icon.textContent = '☀️';
                    if (toggle) toggle.setAttribute('aria-label', '라이트 모드');
                }
            }

            function initTheme() {
                const saved = localStorage.getItem(STORAGE_KEY) || 'dark';
                applyTheme(saved);
            }

            toggle?.addEventListener('click', () => {
                const current = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
                const next = current === 'light' ? 'dark' : 'light';
                localStorage.setItem(STORAGE_KEY, next);
                applyTheme(next);
            });

            initTheme();
        })();
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
