{% extends 'base.html' %}
{% load static %}
{% block title %}500 - ChessOK{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/error.css' %}">
{% endblock %}
{% block content %}
<div class="error-page">
    <div class="error-card">
        <div class="error-icon">⚠️</div>
        <div class="error-code">500</div>
        <h1 class="error-title">서버 오류가 발생했습니다</h1>
        <p class="error-message">일시적인 문제가 발생했습니다. 잠시 후 다시 시도해주세요.</p>
        <div class="error-actions">
            <button class="btn btn-primary" onclick="location.reload()">새로고침</button>
            <a class="btn btn-secondary" href="/">홈으로</a>
        </div>
    </div>
</div>
{% endblock %}
