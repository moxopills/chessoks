{% extends 'base.html' %}
{% load static %}
{% block title %}404 - ChessOK{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/error.css' %}">
{% endblock %}
{% block content %}
<div class="error-page">
    <div class="error-card">
        <div class="error-icon">🔍</div>
        <div class="error-code">404</div>
        <h1 class="error-title">페이지를 찾을 수 없습니다</h1>
        <p class="error-message">요청하신 페이지가 존재하지 않거나 이동되었습니다.</p>
        <div class="error-actions">
            <a class="btn btn-primary" href="/">홈으로 돌아가기</a>
            <button class="btn btn-secondary" onclick="history.back()">이전 페이지</button>
        </div>
    </div>
</div>
{% endblock %}
