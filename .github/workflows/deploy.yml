name: Deploy to Production

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  merge-and-deploy:
    name: Merge to Main & Deploy
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Merge develop to main
      run: |
        git fetch origin main
        git checkout main
        git merge origin/develop --no-ff -m "🔄 Auto merge develop to main

        Automatically merged from develop branch

        Triggered by: ${{ github.sha }}
        Actor: ${{ github.actor }}"
        git push origin main

    - name: Setup SSH Key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to Production Server
      run: |
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
          cd ~/chessoks
          git pull origin main
          cp .envs/.env.prod .env
          docker compose -f docker-compose.prod.yml down
          docker compose -f docker-compose.prod.yml build --no-cache --pull
          docker compose -f docker-compose.prod.yml up -d --force-recreate

          # 불필요한 리소스 정리
          docker system prune -af --volumes
        ENDSSH

    - name: Health Check
      run: |
        echo "Waiting for application to start..."
        sleep 15
        echo "Health check completed"

    - name: Deployment Summary
      if: success()
      run: |
        echo "## 🚀 배포 완료" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **환경**: production" >> $GITHUB_STEP_SUMMARY
        echo "- **develop 커밋**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **main 브랜치**: 자동 업데이트됨" >> $GITHUB_STEP_SUMMARY
        echo "- **배포 시간**: $(date)" >> $GITHUB_STEP_SUMMARY

    - name: Notify on failure
      if: failure()
      run: |
        echo "## ❌ 배포 실패" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "merge 또는 배포 중 오류가 발생했습니다." >> $GITHUB_STEP_SUMMARY
        echo "충돌이 발생한 경우 수동으로 해결이 필요합니다." >> $GITHUB_STEP_SUMMARY

  rollback:
    name: Rollback (if needed)
    runs-on: ubuntu-latest
    needs: merge-and-deploy
    if: failure()
    environment:
      name: production

    steps:
    - name: Setup SSH Key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key

    - name: Rollback deployment
      run: |
        ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
          cd ~/chessoks
          git reset --hard HEAD~1
          cp .envs/.env.prod .env
          docker compose -f docker-compose.prod.yml down
          docker compose -f docker-compose.prod.yml up -d --build
        ENDSSH

    - name: Rollback Summary
      run: |
        echo "## ⚠️ 롤백 완료" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "배포 실패로 인해 이전 버전으로 롤백했습니다." >> $GITHUB_STEP_SUMMARY
